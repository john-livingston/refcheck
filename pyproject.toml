[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refcheck"
version = "0.1.0"
description = "Verify LaTeX bibliography entries against NASA ADS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "John Livingston"}]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.4,<3",
  "python-dotenv>=1,<2",
  "rich>=13,<15",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
refcheck = "refcheck.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
